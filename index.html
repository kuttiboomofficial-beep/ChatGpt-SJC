function securityHash(v){
  let h=2166136261;v=String(v);for(let i=0;i<v.length;i++){h^=v.charCodeAt(i);h=Math.imul(h,16777619)}
  return ('00000000'+(h>>>0).toString(16)).slice(-8)+('00000000'+(Math.imul(h^0x9e3779b9,2654435761)>>>0).toString(16)).slice(-8);
}
function securityEnabled(){return !!(db.settings&&db.settings.security&&db.settings.security.enabled&&db.settings.security.pinHash)}

  const ov=$('securityOverlay');if(!ov)return;
  const setup=mode==='setup';
  ov.innerHTML='<div class="security-box"><div style="font-size:42px">🔐</div><h2>'+ (setup?'Secure SHREE JI CONNECT':'SHREE JI CONNECT Locked') +'</h2><p>'+ (setup?'Create a 4–6 digit PIN. This PIN protects casual access to the app on this device.':'Enter your PIN to continue.') +'</p><label>PIN</label><input id="securityPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••"><div id="securityConfirmWrap" style="display:'+(setup?'block':'none')+'"><label>Confirm PIN</label><input id="securityPin2" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••"></div><div id="securityError" class="security-error">'+esc(msg||'')+'</div><div class="actions"><button class="orange" id="securityAction">'+(setup?'Create PIN':'Unlock')+'</button>'+(setup?'':'<button class="light" onclick="lockApp()">Lock</button>')+'</div><div class="security-hint">For stronger protection, also use your phone/PC screen lock. Never share your PIN.</div></div>';
  ov.classList.add('show');
  const pin=$('securityPin');pin.focus();
  $('securityAction').onclick=setup?setupSecurity:unlockSecurity;
  pin.onkeydown=e=>{if(e.key==='Enter')$(setup?'securityPin2':'securityAction').focus()};
  if(setup)$('securityPin2').onkeydown=e=>{if(e.key==='Enter')setupSecurity()};
}
function setupSecurity(){
  const a=$('securityPin')?.value.trim(),b=$('securityPin2')?.value.trim(),err=$('securityError');
  if(!/^\d{4,6}$/.test(a))return err.textContent='PIN must be 4 to 6 digits.';
  if(a!==b)return err.textContent='PINs do not match.';
  db.settings.security={enabled:true,pinHash:securityHash(a),autoLockMinutes:Number(db.settings.security?.autoLockMinutes)||10};save();securityUnlocked=true;$('securityOverlay').classList.remove('show');startSecurityTimer();toast('Security enabled');
}
function unlockSecurity(){
  if(securityBusy)return;securityBusy=true;
  const pin=$('securityPin')?.value.trim(),err=$('securityError');
  if(securityHash(pin)!==db.settings.security.pinHash){securityBusy=false;err.textContent='Wrong PIN. Try again.';$('securityPin').value='';$('securityPin').focus();return}
  securityUnlocked=true;securityBusy=false;$('securityOverlay').classList.remove('show');startSecurityTimer();toast('Unlocked');
}
function lockApp(){
  if(!securityEnabled())return showSecurityScreen('setup');
  securityUnlocked=false;clearTimeout(securityTimer);showSecurityScreen('unlock');
}
function startSecurityTimer(){
  clearTimeout(securityTimer);if(!securityUnlocked||!securityEnabled())return;
  const mins=Math.max(1,Number(db.settings.security.autoLockMinutes)||10);securityTimer=setTimeout(()=>lockApp(),mins*60*1000);
}
function securityActivity(){if(securityUnlocked)startSecurityTimer()}
['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,securityActivity,{passive:true}));

function load(){
 try{
  let raw=localStorage.getItem(KEY);
  if(!raw){ for(const k of OLD_KEYS){ const old=localStorage.getItem(k); if(old){ raw=old; break; } } }
  let x=raw?JSON.parse(raw):null;
  if(!x)return structuredClone(defaults);
  x=applyProfessionalTemplateDefaults(x);
  return {...structuredClone(defaults),...x,settings:{...defaults.settings,...(x.settings||{}),staff:Array.isArray(x.settings?.staff)?x.settings.staff:[],confirmationPersons:Array.isArray(x.settings?.confirmationPersons)?x.settings.confirmationPersons:[]},templates:x.templates||structuredClone(defaults.templates),customers:x.customers||[],orders:x.orders||[],exhibitions:x.exhibitions||[]};
 }catch(e){return structuredClone(defaults)}
}

const CITY_NAMES=Object.keys(CITY_STATE);
function cityMatches(value){
  const q=String(value||'').trim().toLowerCase();
  if(!q)return [];
  const starts=CITY_NAMES.filter(c=>c.toLowerCase().startsWith(q));
  const contains=CITY_NAMES.filter(c=>!c.toLowerCase().startsWith(q)&&c.toLowerCase().includes(q));
  return [...starts,...contains].slice(0,10);
}
function formatCityName(value){
  const s=String(value||'').trim().replace(/\s+/g,' ').toLowerCase();
  return s ? s.charAt(0).toUpperCase()+s.slice(1) : '';
}
function cityState(value){
  const q=String(value||'').trim().toLowerCase();
  const key=CITY_NAMES.find(c=>c.toLowerCase()===q);
  return key ? CITY_STATE[key] : '';
}
function findCityKey(value){
  const q=String(value||'').trim().toLowerCase();
  if(!q)return '';
  return CITY_NAMES.find(c=>c.toLowerCase()===q) || CITY_NAMES.find(c=>c.toLowerCase().replace(/[^a-z0-9]/g,'')===q.replace(/[^a-z0-9]/g,'')) || '';
}
async function lookupCityStateOnline(value){
  const q=String(value||'').trim();
  if(!q)return '';
  try{
    const url='https://photon.komoot.io/api/?q='+encodeURIComponent(q+', India')+'&limit=10&lang=en';
    const r=await fetch(url,{headers:{'Accept':'application/json'}});
    if(r.ok){
      const d=await r.json();
      const hit=(d.features||[]).find(f=>{
        const p=f.properties||{};
        return String(p.country||'').toLowerCase()==='india' && p.state;
      });
      if(hit) return String(hit.properties.state).trim();
    }
  }catch(e){}
  try{
    const url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&countrycodes=in&q='+encodeURIComponent(q);
    const r=await fetch(url);
    if(r.ok){
      const d=await r.json();
      const hit=(d||[]).find(x=>x.address&&x.address.country_code==='in'&&x.address.state);
      if(hit)return String(hit.address.state).trim();
    }
  }catch(e){}
  return '';
}
async function resolveCityState(value){
  const local=cityState(value);
  if(local)return local;
  return await lookupCityStateOnline(value);
}
function renderCitySuggestions(){
  const city=$('cc'),box=$('citySuggestions');
  if(!city||!box)return;
  const matches=cityMatches(city.value);
  if(!matches.length){box.innerHTML='';box.style.display='none';return;}
  box.innerHTML=matches.map(c=>'<button type="button" class="city-option" onclick="chooseCity(\''+c.replace(/'/g,"\\'")+'\')"><b>'+esc(c)+'</b><span>'+esc(CITY_STATE[c])+'</span></button>').join('');
  box.style.display='block';
}
function chooseCity(name){
  const city=$('cc'),state=$('cstate');
  if(city)city.value=formatCityName(name);
  if(state)state.value=CITY_STATE[name]||'';
  const box=$('citySuggestions');if(box){box.innerHTML='';box.style.display='none';}
}
let cityLookupTimer=null;
let cityLookupSeq=0;
function autoCityState(){
  const city=$('cc'),state=$('cstate');
  if(!city||!state)return;
  const q=city.value.trim();
  const st=cityState(q);
  if(st){state.value=st;}
  else if(!q){state.value='';}
  renderCitySuggestions();
  clearTimeout(cityLookupTimer);
  if(!q || st || q.length<3)return;
  const seq=++cityLookupSeq;
  cityLookupTimer=setTimeout(async()=>{
    const live=$('cc'),liveState=$('cstate');
    if(!live||!liveState||live.value.trim()!==q)return;
    liveState.value='Searching...';
    const found=await resolveCityState(q);
    if(seq!==cityLookupSeq || !live||live.value.trim()!==q)return;
    liveState.value=found||'';
  },500);
}
async function confirmCityField(){
  const city=$('cc'),state=$('cstate');
  if(!city||!state)return '';
  const q=city.value.trim();
  const exact=findCityKey(q);
  if(exact){city.value=formatCityName(exact);state.value=CITY_STATE[exact]||'';return state.value;}
  if(!q){state.value='';return '';}
  state.value='Searching...';
  const st=await resolveCityState(q);
  if(city.value.trim()===q)state.value=st||'';
  return st||'';
}


function formatPersonName(value){
  return String(value||'').trim().replace(/\s+/g,' ').split(' ').filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
}
function formatJewelleryName(value){
  return String(value||'').trim().replace(/\s+/g,' ').toUpperCase();
}
function applyCustomerNameFormats(){
  const n=$('cn'),shop=$('cs');
  if(n)n.value=formatPersonName(n.value);
  if(shop)shop.value=formatJewelleryName(shop.value);
}

async function saveCustomer(id){
  await confirmCityField();
  applyCustomerNameFormats();
  let x={name:formatPersonName($('cn').value),mobile:$('cm').value.trim(),shop:formatJewelleryName($('cs').value),alt:$('ca').value.trim(),city:formatCityName($('cc').value),state:$('cstate').value.trim(),address:$('caddr').value.trim(),notes:$('cnotes').value.trim()};

  if(id)Object.assign(cust(id),x);else db.customers.push({id:Date.now(),...x,customerType:'New',dateAdded:new Date().toISOString().slice(0,10)});
  save();closeModal();renderAll();toast('Customer saved');
}
function customerOrders(customerId,excludeOrderId=0){
 return db.orders.filter(o=>String(o.customerId)===String(customerId) && Number(o.id)!==Number(excludeOrderId||0));
}
function customerOrderCount(customerId,excludeOrderId=0){return customerOrders(customerId,excludeOrderId).length;}

 db.customers.forEach(c=>{const next=customerOrderCount(c.id)>=2?'Existing':'New';if(c.customerType!==next){c.customerType=next;changed=true;}});

const SCREW_TYPES=['South Screw','Bombay Screw','Kambi Posting','South Screw without Biradai','Bombay Screw without Biradai'];
function screwOptions(selected){return '<option value="">-- Select Screw Type --</option>'+SCREW_TYPES.map(x=>'<option value="'+esc(x)+'" '+(String(selected||'')===x?'selected':'')+'>'+esc(x)+'</option>').join('')}
function ringOptions(min,max,selected,fromId,toId){
  const m=String(selected||'').trim(); const match=m.match(/^(\d+)\s*(?:to|-|–)\s*(\d+)$/i);
  const from=match?Number(match[1]):'', to=match?Number(match[2]):'';
  let h='<div style="display:flex;gap:8px;align-items:center"><select id="'+fromId+'" style="flex:1"><option value="">From</option>';
  for(let i=min;i<=max;i++)h+='<option value="'+i+'" '+(from===i?'selected':'')+'>'+i+'</option>';
  h+='</select><span class="muted">to</span><select id="'+toId+'" style="flex:1"><option value="">To</option>';
  for(let i=min;i<=max;i++)h+='<option value="'+i+'" '+(to===i?'selected':'')+'>'+i+'</option>';
  return h+'</select></div>';
}
function ringValue(fromId,toId,old){const a=$(fromId)?.value,b=$(toId)?.value;if(a&&b)return Number(a)<=Number(b)?a+' to '+b:b+' to '+a;return String(old||'').trim()}

function updateOrderCustomerInfo(){
 let id=$('oc')?.value;
 if(!$('orderCustomerInfo'))return;
 if(!id){$('orderCustomerInfo').textContent='';if($('orderExpoHistory'))$('orderExpoHistory').innerHTML='';return;}
 const c=cust(id);
 const editingId=Number(document.querySelector('#orderTakenBy')?.dataset?.orderId||0);
 if($('orderExpoHistory'))$('orderExpoHistory').innerHTML=renderCompactExpoHistory(customerExhibitionHistory(id,editingId));
 const selectedDate=$('od')?.value||'';
 // Customer is Existing only when there is an earlier order for the same customer.
 // The current order itself is never counted, so a first order remains New.
 const priorOrders=customerOrders(id,editingId);
 // Creating a new order: ANY already-saved order means this is an Existing Customer.
 // Editing an order: only an earlier saved order counts; the current order itself never counts.
 const hasEarlierOrder=editingId ? priorOrders.some(o=>{
   const od=String(o.orderDate||'');
   if(!selectedDate || !od) return true;
   return od<selectedDate || (od===selectedDate && Number(o.id)<editingId);
 }) : priorOrders.length>0;
 const label=hasEarlierOrder?'🔁 Existing Customer':'🆕 New Customer';
 $('orderCustomerInfo').innerHTML=esc(c.name||'-')+' - 📱 '+esc(c.mobile||'-')+' &nbsp; <b>'+label+'</b>';
}

function toggleBulk(id,on){
 if(on){if(bulkSel.size>=25&&!bulkSel.has(String(id)))return toast('Maximum 25 customers');bulkSel.add(String(id))}
 else bulkSel.delete(String(id));
 renderBulkList();
}
function selectBulk(on){
 if(!on){bulkSel=new Set();localStorage.removeItem('sjc_bulk_index');renderBulkList();return}
 let q=($('bq')?.value||'').toLowerCase().trim();
 let a=db.customers.filter(c=>(c.name+' '+c.shop+' '+c.mobile+' '+c.city+' '+c.state).toLowerCase().includes(q));
 bulkSel=new Set(a.slice(0,25).map(c=>String(c.id)));localStorage.removeItem('sjc_bulk_index');renderBulkList();
}
function startBulk(){
 localStorage.setItem('sjc_bulk_index','0');
 if(!bulkSel.size)return toast('Select customers first');
 updateBulkProgress();
 nextBulk();
}
function updateBulkProgress(){
 let ids=[...bulkSel],i=+(localStorage.getItem('sjc_bulk_index')||0);
 if($('bulkProgress'))$('bulkProgress').innerHTML=ids.length?('Bulk progress: <b>'+Math.min(i,ids.length)+' / '+ids.length+'</b> opened'):'Select customers to start bulk sending.';
}
function nextBulk(){
 let ids=[...bulkSel],i=+(localStorage.getItem('sjc_bulk_index')||0);
 if(!ids.length)return toast('Select customers first');
 if(i>=ids.length)i=0;
 let c=cust(ids[i]),o=db.orders.filter(x=>x.customerId==c.id).slice(-1)[0],t=db.templates.find(x=>x.id==$('bt').value)||db.templates[0],ex=o?db.exhibitions.find(e=>e.id==o.exhibitionId):null,n=(c.mobile||'').replace(/\D/g,'');
 if(n.length===10)n=(db.settings.country||'91')+n;
 if(n.length<10)return toast('Mobile missing: '+c.name);
 localStorage.setItem('sjc_bulk_index',String(i+1));
 window.open('https://wa.me/'+n+'?text='+encodeURIComponent(applyTemplate(t,c,o,ex)),'_blank');
 toast('Opened '+c.name+' ('+(i+1)+'/'+ids.length+')');
 updateBulkProgress();
}
function sendBulkImage(){
 let ids=[...bulkSel],i=+(localStorage.getItem('sjc_bulk_index')||0);
 if(!ids.length)return toast('Select customers first');
 if(i>=ids.length)i=0;
 let c=cust(ids[i]),n=(c.mobile||'').replace(/\D/g,'');
 if(n.length===10)n=(db.settings.country||'91')+n;
 if(n.length<10)return toast('Mobile missing: '+c.name);
 localStorage.setItem('sjc_bulk_index',String(i+1));
 window.open('https://wa.me/'+n,'_blank');
 toast('WhatsApp opened for '+c.name+' — attach the selected image and send');
}

function openTemplate(id){

function saveTemplate(id){

 if(!x.name||!x.body)return toast('Template name and message required');
 if(id)Object.assign(db.templates.find(t=>t.id===id),x);else db.templates.push({id:'t'+Date.now(),...x});

function exhibitionCustomerType(exhibitionId,customerId){
 let e=db.exhibitions.find(x=>String(x.id)===String(exhibitionId));
 let ids=Array.isArray(e?.existingCustomerIds)?e.existingCustomerIds.map(String):[];
 return ids.includes(String(customerId))?'Existing':'New';
}
function toggleExpoExisting(exhibitionId,customerId,checked){
 let e=db.exhibitions.find(x=>String(x.id)===String(exhibitionId));
 if(!e)return;
 e.existingCustomerIds=Array.isArray(e.existingCustomerIds)?e.existingCustomerIds.map(String):[];
 const cid=String(customerId);
 if(checked){if(!e.existingCustomerIds.includes(cid))e.existingCustomerIds.push(cid)}
 else e.existingCustomerIds=e.existingCustomerIds.filter(x=>x!==cid);
 save();
 exhibitionReport(exhibitionId);
 toast(checked?'Marked as Existing Customer':'Marked as New Customer');
}
function expoData(id){
 let e=db.exhibitions.find(x=>x.id==id);
 let a=db.orders.filter(o=>String(o.exhibitionId)===String(id));
 let ids=[...new Set(a.map(o=>String(o.customerId)))];
 let existing=ids.filter(cid=>exhibitionCustomerType(id,cid)==='Existing');
 let newer=ids.filter(cid=>exhibitionCustomerType(id,cid)==='New');
 let direct=ids.filter(cid=>a.some(o=>String(o.customerId)===cid && o.type==='Direct'));
 let sm=ids.filter(cid=>a.some(o=>String(o.customerId)===cid && o.type==='SM'));
 let directNew=direct.filter(cid=>exhibitionCustomerType(id,cid)==='New');
 let directExisting=direct.filter(cid=>exhibitionCustomerType(id,cid)==='Existing');
 let smNew=sm.filter(cid=>exhibitionCustomerType(id,cid)==='New');
 let smExisting=sm.filter(cid=>exhibitionCustomerType(id,cid)==='Existing');
 let directWeight=a.filter(o=>o.type==='Direct').reduce((s,o)=>s+(+o.weight||0),0);
 let smWeight=a.filter(o=>o.type==='SM').reduce((s,o)=>s+(+o.weight||0),0);
 let totalWeight=directWeight+smWeight;
 return {e,a,ids,existing,newer,direct,sm,directNew,directExisting,smNew,smExisting,directWeight,smWeight,totalWeight};
}
function expoRows(id,kind){
 let d=expoData(id), ids=d.ids;
 if(kind==='direct')ids=d.direct;
 else if(kind==='sm')ids=d.sm;
 else if(kind==='new')ids=d.newer;
 else if(kind==='existing')ids=d.existing;
 else if(kind==='directNew')ids=d.directNew;
 else if(kind==='directExisting')ids=d.directExisting;
 else if(kind==='smNew')ids=d.smNew;
 else if(kind==='smExisting')ids=d.smExisting;
 return ids.map((cid,i)=>{
   let c=cust(cid),ca=d.a.filter(o=>String(o.customerId)===cid);
   if(kind==='direct'||kind==='directNew'||kind==='directExisting')ca=ca.filter(o=>o.type==='Direct');
   if(kind==='sm'||kind==='smNew'||kind==='smExisting')ca=ca.filter(o=>o.type==='SM');
   let types=[...new Set(ca.map(o=>o.type))].join(' / '),w=ca.reduce((s,o)=>s+(+o.weight||0),0);
   return '<tr><td>'+(i+1)+'</td><td><b>'+esc(c.shop||'-')+'</b></td><td>'+esc(c.name||'-')+'</td><td>'+esc(c.mobile||'-')+'</td><td>'+esc(c.city||'-')+'</td><td>'+esc(c.state||'-')+'</td><td>'+esc(exhibitionCustomerType(id,cid))+'</td><td>'+esc(types||'-')+'</td><td>'+fmt(w)+' g</td></tr>';
 }).join('');
}
function expoDetail(id,kind,title){

 let count=map[kind]??0;

}

function bytesToB64(bytes){let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function b64ToBytes(s){let bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function deriveBackupKey(pin,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function backup(){
 if(!securityEnabled())return showSecurityScreen('setup');
 const pin=prompt('Enter your PIN to create encrypted backup:');if(!pin)return;
 if(securityHash(pin)!==db.settings.security.pinHash)return toast('Wrong PIN');
 try{const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveBackupKey(pin,salt);const payload={app:'SHREE JI CONNECT',version:db.settings.version,exportedAt:new Date().toISOString(),data:db};const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(payload)));const out={format:'SJC_ENCRYPTED_BACKUP_V1',salt:bytesToB64(salt),iv:bytesToB64(iv),data:bytesToB64(new Uint8Array(cipher))};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));a.download='shree-ji-connect-encrypted-backup-'+new Date().toISOString().slice(0,10)+'.sjc.json';a.click();toast('Encrypted backup downloaded');}catch(e){console.error(e);toast('Backup failed')}
}
function backupPlain(){
 let payload={app:'SHREE JI CONNECT',version:db.settings.version,exportedAt:new Date().toISOString(),data:db};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='shree-ji-connect-plain-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Plain backup downloaded');
}
async function restoreFile(e){
 let f=e.target.files[0];if(!f)return;
 try{let p=JSON.parse(await f.text()),x;
   if(p.format==='SJC_ENCRYPTED_BACKUP_V1'){
     const pin=prompt('Enter backup PIN to decrypt:');if(!pin)return;
     const key=await deriveBackupKey(pin,b64ToBytes(p.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(p.iv)},key,b64ToBytes(p.data));const q=JSON.parse(new TextDecoder().decode(plain));x=q.data||q;
   }else{x=p.data||p;if(!confirm('This is a plain backup. Restore it?'))return}
   if(!x.customers||!x.orders)throw 1;if(!confirm('Restore this backup? Current local data will be replaced.'))return;
   db={...structuredClone(defaults),...x,settings:{...defaults.settings,...(x.settings||{}),security:{...defaults.settings.security,...(x.settings?.security||{})}},templates:x.templates||structuredClone(defaults.templates)};save();renderAll();toast('Data restored');startSecurityTimer();
 }catch(z){console.error(z);toast('Invalid backup or wrong PIN')}
}
function renderBackup(){
 $('backup').innerHTML='<h2>Backup & Restore</h2><div class="card"><h3>🔐 Secure Backup</h3><p>Your main backup is <b>AES-256 encrypted</b> with your PIN. Keep the backup file and PIN safe.</p><div class="actions"><button class="orange" onclick="backup()">🔐 Export Encrypted Backup</button><label style="display:inline-block;background:#eee;color:#222;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700">🔓 Import Backup<input type="file" accept=".json,.sjc.json" style="display:none" onchange="restoreFile(event)"></label><button class="light" onclick="backupPlain()">Export Plain JSON</button><button class="red" onclick="resetData()">Reset Data</button></div><p class="danger-note">Encrypted backup is recommended. Plain JSON contains customer/order data without encryption.</p></div>';
}

function changeSecurityPin(){
 if(!securityEnabled())return showSecurityScreen('setup');
 const old=prompt('Enter current PIN:');if(old===null)return;if(securityHash(old)!==db.settings.security.pinHash)return toast('Wrong current PIN');
 const a=prompt('Enter new 4–6 digit PIN:');if(!a||!/\d{4,6}/.test(a))return toast('PIN must be 4–6 digits');const b=prompt('Confirm new PIN:');if(a!==b)return toast('PINs do not match');db.settings.security.pinHash=securityHash(a);save();toast('PIN changed');lockApp();
}
function saveSettings(){
 db.settings.company=$('setCompany').value.trim();db.settings.subtitle=$('setSubtitle').value.trim();db.settings.phone=$('setPhone').value.trim();db.settings.country=$('setCountry').value.replace(/\D/g,'')||'91';db.settings.address=$('setAddress').value.trim();db.settings.defaultType=$('setType').value;db.settings.defaultStatus=$('setStatus').value;db.settings.staff=String($('setStaff')?.value||'').split(',').map(x=>x.trim()).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);db.settings.confirmationPersons=String($('setConfirmPersons')?.value||'').split(',').map(x=>x.trim()).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);db.settings.security={...defaults.settings.security,...(db.settings.security||{}),autoLockMinutes:Number($('setAutoLock')?.value)||10};save();renderAll();startSecurityTimer();toast('Settings saved');
}

document.addEventListener('keydown',async e=>{
  if(e.key!=='Enter'||e.shiftKey||e.ctrlKey||e.altKey)return;
  const t=e.target;
  if(!t.closest('.modal'))return;
  if(t.tagName==='TEXTAREA')return;
  e.preventDefault();
  if(t.id==='cc'){await confirmCityField();}
  const modalEl=$('modal');
  const fields=[...modalEl.querySelectorAll('input:not([type="hidden"]):not([disabled]),select:not([disabled]),textarea:not([disabled]),button:not(.light)')].filter(x=>x.offsetParent!==null);
  const i=fields.indexOf(t);
  if(i>=0&&i<fields.length-1){fields[i+1].focus();if(fields[i+1].select)try{fields[i+1].select()}catch(_){} }
});
