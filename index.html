<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="description" content="SHREE JI CONNECT - Business CRM, Orders, Production, WhatsApp, Reports and Exhibition Management">
<title>SHREE JI CONNECT</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#171717}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:10px;padding:11px 16px;background:#111;color:#fff;cursor:pointer;font-weight:700}
button.orange{background:#f47b00}button.green{background:#198c43}button.red{background:#c62828}button.light{background:#eee;color:#222}
header{background:#111;color:#fff;padding:18px 26px;border-bottom:5px solid #f47b00;position:sticky;top:0;z-index:20}
#printPageBtn{float:right;margin-top:-42px;background:#fff;color:#222;border:0;padding:10px 14px;border-radius:10px}#printPageBtn:hover{background:#eee}
#brand{font-size:24px;font-weight:800}#subtitle{color:#bbb;margin-top:5px}
nav{display:flex;gap:10px;overflow-x:auto;white-space:nowrap;background:#fff;padding:10px;border-bottom:1px solid #ddd;position:sticky;top:91px;z-index:19}
nav button{background:#eee;color:#333;padding:12px 18px;border-radius:13px}
nav button.active{background:#f47b00;color:#fff}
main{max-width:1450px;margin:auto;padding:18px}
section{display:none}section.active{display:block}
h2{font-size:30px;margin:8px 0 20px}h3{margin-top:4px}
.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0000000c}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px}
.kpi{font-size:30px;font-weight:800;margin-top:8px}.muted{color:#777;font-size:14px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}
label{display:block;font-size:14px;font-weight:700;margin:6px 0}
input,select,textarea{width:100%;padding:12px;border:1px solid #d2d2d2;border-radius:10px;background:#fff}
textarea{resize:vertical}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.actions input,.actions select{width:auto;min-width:180px}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:11px;border-bottom:1px solid #e8e8e8;text-align:left;vertical-align:middle}th{background:#f6f6f6}
td button{margin:2px;padding:8px 10px;font-size:13px}
.status{display:inline-block;padding:6px 10px;border-radius:18px;font-size:12px;font-weight:700}
.s-Pending{background:#fff3cd;color:#856404}.s-Started{background:#cfe2ff;color:#084298}
.s-Finished{background:#d1e7dd;color:#0f5132}.s-Delivered{background:#d1e7dd;color:#146c43}.s-Cancelled{background:#f8d7da;color:#842029}
.hero{background:#111;color:#fff;border-radius:22px;padding:26px;margin-bottom:18px}
.hero .big{font-size:22px;font-weight:800}.hero p{color:#ccc;font-size:17px}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.empty{padding:25px;text-align:center;color:#777}
.modalbg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:12px;z-index:50}
.modalbg.show{display:flex}.modal{width:min(950px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:18px;padding:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:24px;display:none;z-index:100}
.preview{max-width:100%;max-height:220px;border-radius:12px;border:1px solid #ddd}
.small{font-size:12px}.danger-note{background:#fff3cd;border-radius:10px;padding:10px;color:#856404}

.bulk-toolbar{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;align-items:end}
.bulk-list{border:1px solid #ddd;border-radius:14px;overflow:hidden;margin-top:14px}
.bulk-head,.bulk-row{display:grid;grid-template-columns:48px minmax(180px,1.2fr) minmax(160px,1fr) minmax(120px,.8fr) minmax(110px,.7fr);gap:10px;align-items:center;padding:12px 14px}
.bulk-head{background:#f6f6f6;font-size:13px;font-weight:800}
.bulk-row{border-top:1px solid #eee;background:#fff}
.bulk-row:hover{background:#fafafa}
.bulk-row input[type=checkbox]{width:18px;height:18px}
.bulk-name{font-weight:800}.bulk-contact{font-weight:700}.bulk-mobile{font-size:14px}.bulk-city{color:#555;font-size:14px}
.bulk-count{font-size:15px;font-weight:800}.bulk-limit{font-size:13px;color:#777}
.bulk-selected{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.bulk-chip{background:#f1f1f1;border-radius:18px;padding:7px 10px;font-size:12px;font-weight:700}
@media(max-width:700px){.bulk-toolbar{grid-template-columns:1fr}.bulk-head{display:none}.bulk-row{grid-template-columns:36px 1fr 1fr;gap:7px}.bulk-row>div:nth-child(4),.bulk-row>div:nth-child(5){display:none}}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.quick{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){
 header{padding:15px 18px}#brand{font-size:21px}
 nav{top:83px;padding:8px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}
 .grid,.tiles{grid-template-columns:1fr 1fr}main{padding:12px}h2{font-size:26px}.card{padding:14px}
 .quick{grid-template-columns:1fr 1fr}.actions input,.actions select{min-width:145px;flex:1}
}

@media print{
 @page{size:A4 portrait;margin:12mm}
 body{background:#fff!important;color:#111!important}
 header,nav,#toast,.modalbg,#printPageBtn,.no-print{display:none!important}
 main{max-width:none!important;margin:0!important;padding:0!important}
 section{display:none!important}
 section.active{display:block!important}
 .card,.tile,.hero{box-shadow:none!important;border:1px solid #bbb!important;break-inside:avoid}
 h2{font-size:22px!important;margin:0 0 12px!important}
 .grid{grid-template-columns:repeat(4,1fr)!important;gap:8px!important}
 .kpi{font-size:20px!important}
 .hero{background:#111!important;color:#fff!important}
 .tablewrap{break-inside:auto!important}
 tr{break-inside:avoid;page-break-inside:avoid}
 .actions{display:none!important}
 button{display:none!important}
 .tablewrap{overflow:visible!important}
 table{min-width:0!important;width:100%!important;font-size:11px}
 th,td{padding:6px!important;border:1px solid #ccc!important}
 input,select,textarea{border:0!important;background:#fff!important;padding:4px!important}
 .city-suggestions{display:none!important}
}
@media(max-width:650px){#printPageBtn{float:none;position:absolute;right:14px;top:14px;margin:0;padding:9px 11px;font-size:13px}}

.city-field{position:relative}.city-suggestions{display:none;position:absolute;left:0;right:0;top:100%;z-index:100;background:#fff;border:1px solid #d5d5d5;border-radius:10px;box-shadow:0 8px 22px #0002;overflow:hidden;margin-top:4px}.city-option{width:100%;border:0;border-radius:0;background:#fff;color:#222;text-align:left;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.city-option:hover,.city-option:focus{background:#f6f6f6}.city-option span{color:#777;font-size:13px;margin-left:12px}
.security-overlay{position:fixed;inset:0;background:#111;display:none;align-items:center;justify-content:center;padding:18px;z-index:10000}.security-overlay.show{display:flex}.security-box{width:min(420px,100%);background:#fff;border-radius:20px;padding:26px;box-shadow:0 20px 70px #0008}.security-box h2{margin:0 0 8px;font-size:26px}.security-box p{color:#666;line-height:1.45}.security-box input{font-size:22px;text-align:center;letter-spacing:7px}.security-error{min-height:20px;color:#c62828;font-size:13px;font-weight:700;margin-top:8px}.security-hint{font-size:12px;color:#888;margin-top:10px}.print-only{display:none}.customer-type-select{min-width:170px;padding:7px 9px;border:1px solid #ddd;border-radius:8px;background:#fff;font-weight:700}
@media print{.no-print{display:none!important}.print-only{display:inline!important}.security-overlay{display:none!important}}

.compact-expo-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.expo-kpi{border:1px solid #ddd;text-align:left;cursor:pointer;min-height:108px;padding:14px}.expo-kpi:hover{transform:translateY(-1px)}.expo-kpi .kpi{font-size:26px;margin:5px 0}.report-head{margin-bottom:10px}.report-head h3{margin:0 0 4px}@media(max-width:800px){.compact-expo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div id="brand">SHREE JI GOLD CREATOR LLP</div><div id="subtitle">Customer CRM • Orders • Production • WhatsApp • Reports</div><button id="lockBtn" class="light no-print" onclick="lockApp()">🔒 Lock</button><button id="printPageBtn" class="light no-print" onclick="printCurrentPage()">🖨️ Print Page</button></header>
<nav id="nav"></nav>
<main>
<section id="dashboard"></section>
<section id="customers"></section>
<section id="orders"></section>
<section id="production"></section>
<section id="reports"></section>
<section id="whatsapp"></section>
<section id="templates"></section>
<section id="exhibitions"></section>
<section id="print"></section>
<section id="scanner"></section>
<section id="backup"></section>
<section id="settings"></section>
<section id="menu"></section>
</main>
<div id="modalbg" class="modalbg"><div id="modal" class="modal"></div></div>
<div id="toast" class="toast"></div><div id="securityOverlay" class="security-overlay" aria-modal="true" role="dialog"></div>

<script>
const KEY='sjc_business_v7';
const OLD_KEYS=['sjc_business_v6','sjc_business_v5','sjc_business_v3'];
const STATUS=['Pending','Started','Finished','Delivered','Cancelled'];
const defaults={
 settings:{company:'SHREE JI GOLD CREATOR LLP',subtitle:'Customer CRM • Orders • Production • WhatsApp • Reports',phone:'',address:'',country:'91',defaultType:'Direct',defaultStatus:'Pending',version:'7.1.0',logo:'',staff:[],security:{enabled:false,pinHash:'',autoLockMinutes:10}},
 customers:[],orders:[],exhibitions:[],
 templates:[
  {id:'confirm',name:'Order Received Thank You',body:'Dear {{name}},\\n\\nThank you for your valuable order.\\nOrder: {{order}}\\nWeight: {{weight}}g\\n\\nThank you.'},
  {id:'started',name:'Order Started',body:'Dear {{name}},\\n\\nYour order {{order}} has been started.\\nWeight: {{weight}}g\\nStatus: {{status}}\\n\\nThank you.'},
  {id:'finished',name:'Order Finished',body:'Dear {{name}},\\n\\nYour order {{order}} has been finished.\\nStatus: {{status}}\\n\\nThank you.'},
  {id:'ready',name:'Order Ready',body:'Dear {{name}},\\n\\nYour order {{order}} is ready for delivery.\\n\\nThank you.'},
  {id:'delivery',name:'Delivery Update',body:'Dear {{name}},\\n\\nYour order {{order}} status is {{status}}.\\n\\nThank you.'},
  {id:'cancelled',name:'Order Cancelled',body:'Dear {{name}},\\n\\nYour order {{order}} has been cancelled.\\n\\nThank you.'},
  {id:'expo15',name:'Exhibition Invite - 15 Days',body:'Dear {{name}},\\n\\nOur exhibition is coming soon. Please visit our stall.\\n\\nThank you.'},
  {id:'expotoday',name:'Exhibition Invite - Today',body:'Dear {{name}},\\n\\nOur exhibition is today. Stall No: {{stall}}. Please visit us.\\n\\nThank you.'},
  {id:'visit',name:'Stall Visit Thank You',body:'Dear {{name}},\\n\\nThank you for visiting our exhibition stall. We truly appreciate your visit.\\n\\nThank you.'},
  {id:'festival',name:'Festival Greeting',body:'Dear {{name}},\\n\\nWarm festival wishes from SHREE JI GOLD CREATOR LLP.\\n\\nThank you.'},
  {id:'review',name:'Review Request',body:'Dear {{name}},\\n\\nThank you for choosing us. We would appreciate your valuable review.\\n\\nThank you.'},
  {id:'repeat',name:'Repeat Order',body:'Dear {{name}},\\n\\nIt has been a pleasure serving you again. Please let us know if you need anything.\\n\\nThank you.'},
  {id:'collection',name:'New Collection',body:'Dear {{name}},\\n\\nOur new collection is now available. Please contact us for details.\\n\\nThank you.'},
  {id:'follow',name:'Follow-Up',body:'Dear {{name}},\\n\\nJust following up on your order. Please let us know if you need any assistance.\\n\\nThank you.'},
  {id:'custom',name:'Custom Message',body:'Dear {{name}},\\n\\n'}
 ]
};
let db=load(),current='dashboard',scanFile=null,bulkSel=new Set();
let securityUnlocked=false,securityTimer=null,securityBusy=false;
// Exhibition-wise manual New/Existing classification. Existing customer IDs are chosen by the user.
(function initExpoCustomerTypes(){
 db.exhibitions.forEach(e=>{
  if(!Array.isArray(e.existingCustomerIds)){
   const start=e.start||'';
   const expoIds=[...new Set(db.orders.filter(o=>String(o.exhibitionId)===String(e.id)).map(o=>String(o.customerId)))];
   e.existingCustomerIds=expoIds.filter(cid=>db.orders.some(o=>String(o.customerId)===cid && String(o.exhibitionId)!==String(e.id) && (!start || !o.orderDate || o.orderDate<start)));
  }
 });
 save();
})();


function securityHash(v){
  let h=2166136261;v=String(v);for(let i=0;i<v.length;i++){h^=v.charCodeAt(i);h=Math.imul(h,16777619)}
  return ('00000000'+(h>>>0).toString(16)).slice(-8)+('00000000'+(Math.imul(h^0x9e3779b9,2654435761)>>>0).toString(16)).slice(-8);
}
function securityEnabled(){return !!(db.settings&&db.settings.security&&db.settings.security.enabled&&db.settings.security.pinHash)}
function showSecurityScreen(mode='unlock',msg=''){
  const ov=$('securityOverlay');if(!ov)return;
  const setup=mode==='setup';
  ov.innerHTML='<div class="security-box"><div style="font-size:42px">🔐</div><h2>'+ (setup?'Secure SHREE JI CONNECT':'SHREE JI CONNECT Locked') +'</h2><p>'+ (setup?'Create a 4–6 digit PIN. This PIN protects casual access to the app on this device.':'Enter your PIN to continue.') +'</p><label>PIN</label><input id="securityPin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••"><div id="securityConfirmWrap" style="display:'+(setup?'block':'none')+'"><label>Confirm PIN</label><input id="securityPin2" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••"></div><div id="securityError" class="security-error">'+esc(msg||'')+'</div><div class="actions"><button class="orange" id="securityAction">'+(setup?'Create PIN':'Unlock')+'</button>'+(setup?'':'<button class="light" onclick="lockApp()">Lock</button>')+'</div><div class="security-hint">For stronger protection, also use your phone/PC screen lock. Never share your PIN.</div></div>';
  ov.classList.add('show');
  const pin=$('securityPin');pin.focus();
  $('securityAction').onclick=setup?setupSecurity:unlockSecurity;
  pin.onkeydown=e=>{if(e.key==='Enter')$(setup?'securityPin2':'securityAction').focus()};
  if(setup)$('securityPin2').onkeydown=e=>{if(e.key==='Enter')setupSecurity()};
}
function setupSecurity(){
  const a=$('securityPin')?.value.trim(),b=$('securityPin2')?.value.trim(),err=$('securityError');
  if(!/^\d{4,6}$/.test(a))return err.textContent='PIN must be 4 to 6 digits.';
  if(a!==b)return err.textContent='PINs do not match.';
  db.settings.security={enabled:true,pinHash:securityHash(a),autoLockMinutes:Number(db.settings.security?.autoLockMinutes)||10};save();securityUnlocked=true;$('securityOverlay').classList.remove('show');startSecurityTimer();toast('Security enabled');
}
function unlockSecurity(){
  if(securityBusy)return;securityBusy=true;
  const pin=$('securityPin')?.value.trim(),err=$('securityError');
  if(securityHash(pin)!==db.settings.security.pinHash){securityBusy=false;err.textContent='Wrong PIN. Try again.';$('securityPin').value='';$('securityPin').focus();return}
  securityUnlocked=true;securityBusy=false;$('securityOverlay').classList.remove('show');startSecurityTimer();toast('Unlocked');
}
function lockApp(){
  if(!securityEnabled())return showSecurityScreen('setup');
  securityUnlocked=false;clearTimeout(securityTimer);showSecurityScreen('unlock');
}
function startSecurityTimer(){
  clearTimeout(securityTimer);if(!securityUnlocked||!securityEnabled())return;
  const mins=Math.max(1,Number(db.settings.security.autoLockMinutes)||10);securityTimer=setTimeout(()=>lockApp(),mins*60*1000);
}
function securityActivity(){if(securityUnlocked)startSecurityTimer()}
['click','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,securityActivity,{passive:true}));

function $(id){return document.getElementById(id)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function load(){
 try{
  let raw=localStorage.getItem(KEY);
  if(!raw){ for(const k of OLD_KEYS){ const old=localStorage.getItem(k); if(old){ raw=old; break; } } }
  let x=raw?JSON.parse(raw):null;
  if(!x)return structuredClone(defaults);
  return {...structuredClone(defaults),...x,settings:{...defaults.settings,...(x.settings||{}),staff:Array.isArray(x.settings?.staff)?x.settings.staff:[]},templates:x.templates||structuredClone(defaults.templates),customers:x.customers||[],orders:x.orders||[],exhibitions:x.exhibitions||[]};
 }catch(e){return structuredClone(defaults)}
}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{$('toast').style.display='none'},1800)}
function cust(id){return db.customers.find(x=>String(x.id)===String(id))||{name:'Unknown',shop:'',mobile:'',city:'',state:'',address:''}}
function ord(id){return db.orders.find(x=>String(x.id)===String(id))}
function staffList(){return Array.isArray(db.settings.staff)?db.settings.staff.filter(x=>String(x||'').trim()).map(x=>String(x).trim()):[]}
function staffOptions(selected,allowBlank=true){
 let a=staffList(),html=allowBlank?'<option value="">-- Select Staff --</option>':'';
 if(selected && !a.includes(selected))a=[selected,...a];
 return html+a.map(n=>'<option value="'+esc(n)+'" '+(n===selected?'selected':'')+'>'+esc(n)+'</option>').join('');
}
function fmt(n){return Number(n||0).toFixed(2)}
function badge(s){s=s||'Pending';return '<span class="status s-'+esc(s)+'">'+esc(s)+'</span>'}
function nav(){
 const a=[['dashboard','Dashboard'],['customers','Customer CRM'],['orders','Order Management'],['production','Production'],['reports','Reports'],['whatsapp','WhatsApp'],['templates','Templates'],['exhibitions','Exhibitions'],['print','Print Center'],['scanner','Visiting Card Scanner'],['backup','Backup & Restore'],['settings','Settings'],['menu','☰ Menu']];
 $('nav').innerHTML=a.map(x=>'<button class="'+(current===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('');
}
function go(id){current=id;document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');renderAll()}
function modal(title,body){$('modal').innerHTML='<h2>'+esc(title)+'</h2>'+body+'<div class="actions"><button class="light" onclick="closeModal()">Close</button></div>';$('modalbg').classList.add('show')}
function closeModal(){$('modalbg').classList.remove('show')}
function totals(){
 let z={weight:0};STATUS.forEach(s=>z[s.toLowerCase()]=0);
 db.orders.forEach(o=>{z.weight+=+o.weight||0;z[(STATUS.includes(o.status)?o.status:'Pending').toLowerCase()]++});
 return z;
}
function renderDashboard(){
 let t=totals();
 let directOrders=db.orders.filter(o=>o.type==='Direct');
 let smOrders=db.orders.filter(o=>o.type==='SM');
 let directWeight=directOrders.reduce((s,o)=>s+(+o.weight||0),0);
 let smWeight=smOrders.reduce((s,o)=>s+(+o.weight||0),0);
 $('dashboard').innerHTML='<div class="hero"><div class="big">'+esc(db.settings.company)+'</div><p>'+esc(db.settings.subtitle)+'</p></div>'+ '<h2>Dashboard</h2><div class="grid">'+ [['Total Customers',db.customers.length],['Total Orders',db.orders.length],['Direct / SM',directOrders.length+' / '+smOrders.length],['Direct Weight',fmt(directWeight)+' g'],['SM Weight',fmt(smWeight)+' g'],['Total Weight',fmt(t.weight)+' g'],['Pending',t.pending],['Started',t.started],['Finished',t.finished],['Delivered',t.delivered],['Cancelled',t.cancelled]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="kpi">'+x[1]+'</div></div>').join('')+ '</div><div class="card"><h2 style="font-size:22px">Quick Actions</h2><div class="quick"><button class="orange" onclick="openCustomer()">+ Customer</button><button class="orange" onclick="openOrder()">+ Order</button><button class="green" onclick="go(\'whatsapp\')">WhatsApp</button><button onclick="go(\'scanner\')">Scan Card</button><button onclick="go(\'reports\')">Reports</button></div></div>';
}
function recentOrders(){
 let a=db.orders.slice().reverse().slice(0,8);
 if(!a.length)return '<div class="empty">No orders yet</div>';
 return '<div class="tablewrap"><table><tr><th>Order</th><th>Customer</th><th>Weight</th><th>Status</th></tr>'+a.map(o=>'<tr><td>'+esc(o.orderNo)+'</td><td>'+esc(cust(o.customerId).name)+'</td><td>'+fmt(o.weight)+'g</td><td>'+badge(o.status)+'</td></tr>').join('')+'</table></div>';

const CITY_NAMES=Object.keys(CITY_STATE);
function cityMatches(value){
  const q=String(value||'').trim().toLowerCase();
  if(!q)return [];
  const starts=CITY_NAMES.filter(c=>c.toLowerCase().startsWith(q));
  const contains=CITY_NAMES.filter(c=>!c.toLowerCase().startsWith(q)&&c.toLowerCase().includes(q));
  return [...starts,...contains].slice(0,10);
}
function cityState(value){
  const q=String(value||'').trim().toLowerCase();
  const key=CITY_NAMES.find(c=>c.toLowerCase()===q);
  return key ? CITY_STATE[key] : '';
}
function findCityKey(value){
  const q=String(value||'').trim().toLowerCase();
  if(!q)return '';
  return CITY_NAMES.find(c=>c.toLowerCase()===q) || CITY_NAMES.find(c=>c.toLowerCase().replace(/[^a-z0-9]/g,'')===q.replace(/[^a-z0-9]/g,'')) || '';
}
async function lookupCityStateOnline(value){
  const q=String(value||'').trim();
  if(!q)return '';
  try{
    const url='https://photon.komoot.io/api/?q='+encodeURIComponent(q+', India')+'&limit=10&lang=en';
    const r=await fetch(url,{headers:{'Accept':'application/json'}});
    if(r.ok){
      const d=await r.json();
      const hit=(d.features||[]).find(f=>{
        const p=f.properties||{};
        return String(p.country||'').toLowerCase()==='india' && p.state;
      });
      if(hit) return String(hit.properties.state).trim();
    }
  }catch(e){}
  try{
    const url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&countrycodes=in&q='+encodeURIComponent(q);
    const r=await fetch(url);
    if(r.ok){
      const d=await r.json();
      const hit=(d||[]).find(x=>x.address&&x.address.country_code==='in'&&x.address.state);
      if(hit)return String(hit.address.state).trim();
    }
  }catch(e){}
  return '';
}
async function resolveCityState(value){
  const local=cityState(value);
  if(local)return local;
  return await lookupCityStateOnline(value);
}
function renderCitySuggestions(){
  const city=$('cc'),box=$('citySuggestions');
  if(!city||!box)return;
  const matches=cityMatches(city.value);
  if(!matches.length){box.innerHTML='';box.style.display='none';return;}
  box.innerHTML=matches.map(c=>'<button type="button" class="city-option" onclick="chooseCity(\''+c.replace(/'/g,"\\'")+'\')"><b>'+esc(c)+'</b><span>'+esc(CITY_STATE[c])+'</span></button>').join('');
  box.style.display='block';
}
function chooseCity(name){
  const city=$('cc'),state=$('cstate');
  if(city)city.value=name;
  if(state)state.value=CITY_STATE[name]||'';
  const box=$('citySuggestions');if(box){box.innerHTML='';box.style.display='none';}
}
let cityLookupTimer=null;
let cityLookupSeq=0;
function autoCityState(){
  const city=$('cc'),state=$('cstate');
  if(!city||!state)return;
  const q=city.value.trim();
  const st=cityState(q);
  if(st){state.value=st;}
  else if(!q){state.value='';}
  renderCitySuggestions();
  clearTimeout(cityLookupTimer);
  if(!q || st || q.length<3)return;
  const seq=++cityLookupSeq;
  cityLookupTimer=setTimeout(async()=>{
    const live=$('cc'),liveState=$('cstate');
    if(!live||!liveState||live.value.trim()!==q)return;
    liveState.value='Searching...';
    const found=await resolveCityState(q);
    if(seq!==cityLookupSeq || !live||live.value.trim()!==q)return;
    liveState.value=found||'';
  },500);
}
async function confirmCityField(){
  const city=$('cc'),state=$('cstate');
  if(!city||!state)return '';
  const q=city.value.trim();
  const exact=findCityKey(q);
  if(exact){city.value=exact;state.value=CITY_STATE[exact]||'';return state.value;}
  if(!q){state.value='';return '';}
  state.value='Searching...';
  const st=await resolveCityState(q);
  if(city.value.trim()===q)state.value=st||'';
  return st||'';
}


function formatPersonName(value){
  return String(value||'').trim().replace(/\s+/g,' ').split(' ').filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');
}
function formatJewelleryName(value){
  return String(value||'').trim().replace(/\s+/g,' ').toUpperCase();
}
function applyCustomerNameFormats(){
  const n=$('cn'),shop=$('cs');
  if(n)n.value=formatPersonName(n.value);
  if(shop)shop.value=formatJewelleryName(shop.value);
}

function openExhibition(id){

 modal(id?'Edit Exhibition':'New Exhibition','<div class="formgrid"><div><label>Exhibition Name *</label><input id="en" value="'+esc(e.name)+'"></div><div><label>Location</label><input id="el" value="'+esc(e.location)+'"></div><div><label>Start Date</label><input id="es" type="date" value="'+esc(e.start)+'"></div><div><label>End Date</label><input id="ee" type="date" value="'+esc(e.end)+'"></div><div><label>Stall No</label><input id="estall" value="'+esc(e.stall)+'"></div><div class="full"><label>Exhibition Notes</label><textarea id="enotes" rows="4">'+esc(e.notes)+'</textarea></div></div><button class="orange" onclick="saveExhibition('+(id||0)+')">Save Exhibition</button>');
}
function saveExhibition(id){
 let x={name:$('en').value.trim(),location:$('el').value.trim(),start:$('es').value,end:$('ee').value,stall:$('estall').value.trim(),notes:$('enotes').value.trim()};
 if(!x.name)return toast('Exhibition name required');
 if(id)Object.assign(db.exhibitions.find(e=>e.id==id),x);else db.exhibitions.push({id:Date.now(),...x});
 save();closeModal();renderAll();toast('Exhibition saved');
}
function delExhibition(id){
 if(confirm('Delete this exhibition? Orders will not be deleted.')){
  db.exhibitions=db.exhibitions.filter(e=>e.id!=id);db.orders.forEach(o=>{if(o.exhibitionId==id)o.exhibitionId=''});save();renderAll();toast('Exhibition deleted');
 }
}
function exhibitionCustomerType(exhibitionId,customerId){
 let e=db.exhibitions.find(x=>String(x.id)===String(exhibitionId));
 let ids=Array.isArray(e?.existingCustomerIds)?e.existingCustomerIds.map(String):[];
 return ids.includes(String(customerId))?'Existing':'New';
}
function toggleExpoExisting(exhibitionId,customerId,checked){
 let e=db.exhibitions.find(x=>String(x.id)===String(exhibitionId));
 if(!e)return;
 e.existingCustomerIds=Array.isArray(e.existingCustomerIds)?e.existingCustomerIds.map(String):[];
 const cid=String(customerId);
 if(checked){if(!e.existingCustomerIds.includes(cid))e.existingCustomerIds.push(cid)}
 else e.existingCustomerIds=e.existingCustomerIds.filter(x=>x!==cid);
 save();
 exhibitionReport(exhibitionId);
 toast(checked?'Marked as Existing Customer':'Marked as New Customer');
}
function expoData(id){
 let e=db.exhibitions.find(x=>x.id==id);
 let a=db.orders.filter(o=>String(o.exhibitionId)===String(id));
 let ids=[...new Set(a.map(o=>String(o.customerId)))];
 let existing=ids.filter(cid=>exhibitionCustomerType(id,cid)==='Existing');
 let newer=ids.filter(cid=>exhibitionCustomerType(id,cid)==='New');
 let direct=ids.filter(cid=>a.some(o=>String(o.customerId)===cid && o.type==='Direct'));
 let sm=ids.filter(cid=>a.some(o=>String(o.customerId)===cid && o.type==='SM'));
 let directNew=direct.filter(cid=>exhibitionCustomerType(id,cid)==='New');
 let directExisting=direct.filter(cid=>exhibitionCustomerType(id,cid)==='Existing');
 let smNew=sm.filter(cid=>exhibitionCustomerType(id,cid)==='New');
 let smExisting=sm.filter(cid=>exhibitionCustomerType(id,cid)==='Existing');
 let directWeight=a.filter(o=>o.type==='Direct').reduce((s,o)=>s+(+o.weight||0),0);
 let smWeight=a.filter(o=>o.type==='SM').reduce((s,o)=>s+(+o.weight||0),0);
 let totalWeight=directWeight+smWeight;
 return {e,a,ids,existing,newer,direct,sm,directNew,directExisting,smNew,smExisting,directWeight,smWeight,totalWeight};
}
function expoRows(id,kind){
 let d=expoData(id), ids=d.ids;
 if(kind==='direct')ids=d.direct;
 else if(kind==='sm')ids=d.sm;
 else if(kind==='new')ids=d.newer;
 else if(kind==='existing')ids=d.existing;
 else if(kind==='directNew')ids=d.directNew;
 else if(kind==='directExisting')ids=d.directExisting;
 else if(kind==='smNew')ids=d.smNew;
 else if(kind==='smExisting')ids=d.smExisting;
 return ids.map((cid,i)=>{
   let c=cust(cid),ca=d.a.filter(o=>String(o.customerId)===cid);
   if(kind==='direct'||kind==='directNew'||kind==='directExisting')ca=ca.filter(o=>o.type==='Direct');
   if(kind==='sm'||kind==='smNew'||kind==='smExisting')ca=ca.filter(o=>o.type==='SM');
   let types=[...new Set(ca.map(o=>o.type))].join(' / '),w=ca.reduce((s,o)=>s+(+o.weight||0),0);
   return '<tr><td>'+(i+1)+'</td><td><b>'+esc(c.shop||'-')+'</b></td><td>'+esc(c.name||'-')+'</td><td>'+esc(c.mobile||'-')+'</td><td>'+esc(c.city||'-')+'</td><td>'+esc(c.state||'-')+'</td><td>'+esc(exhibitionCustomerType(id,cid))+'</td><td>'+esc(types||'-')+'</td><td>'+fmt(w)+' g</td></tr>';
 }).join('');
}
function expoDetail(id,kind,title){
 let d=expoData(id),e=d.e;
 let map={total:d.ids.length,direct:d.direct.length,sm:d.sm.length,directNew:d.directNew.length,directExisting:d.directExisting.length,smNew:d.smNew.length,smExisting:d.smExisting.length,new:d.newer.length,existing:d.existing.length};
 let count=map[kind]??0;
 let label=title||'Customer Details';
 let rows=expoRows(id,kind);
 let empty=kind==='total'?'No customers in this exhibition':('No '+label.toLowerCase());

}

function preprocessCard(file){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=()=>{
   const maxW=2200,maxH=1600,scale=Math.min(1,maxW/img.naturalWidth,maxH/img.naturalHeight);
   const c=$('ocrCanvas');c.width=Math.max(900,Math.round(img.naturalWidth*scale));c.height=Math.max(600,Math.round(img.naturalHeight*scale));
   const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,c.width,c.height);
   const im=ctx.getImageData(0,0,c.width,c.height),d=im.data;
   for(let i=0;i<d.length;i+=4){const lum=.299*d[i]+.587*d[i+1]+.114*d[i+2];let v=(lum-128)*1.45+128;v=Math.max(0,Math.min(255,v));d[i]=d[i+1]=d[i+2]=v;}
   ctx.putImageData(im,0,0);resolve(c.toDataURL('image/png'));
  };img.onerror=reject;img.src=URL.createObjectURL(file);
 });
}
function normalizeOcrLine(x){return String(x||'').replace(/[|~`^]+/g,' ').replace(/\s+/g,' ').trim();}
function goodOcrLine(x){const s=normalizeOcrLine(x);if(s.length<3||s.length>90)return false;if(/^[-_=.,:;\/\\]+$/.test(s))return false;const letters=(s.match(/[A-Za-z]/g)||[]).length,digits=(s.match(/\d/g)||[]).length;if(letters<3||digits>letters*1.4)return false;return true;}
function extractPhones(text){const raw=String(text||'').replace(/[^\d+\-\s]/g,' '),found=[];for(const m of raw.matchAll(/(?:\+?91[\s-]?)?[6-9]\d{4}[\s-]?\d{5}/g)){const n=m[0].replace(/\D/g,'').slice(-10);if(n.length===10&&!found.includes(n))found.push(n);}return found;}
function extractCity(text){const low=String(text||'').toLowerCase();return CITY_NAMES.find(c=>low.includes(c.toLowerCase()))||'';}
function extractEmail(text){const m=String(text||'').match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);return m?m[0]:'';}
function scoreNameLine(s){let score=0,x=s.toLowerCase();if(/^(mr|mrs|ms|dr)\.?\s/.test(x))score+=3;if(/manager|director|owner|proprietor|partner|contact|mobile|phone|email|www|\.com|road|street|address|india|tamil|nadu|karnataka|kerala|telangana|maharashtra|jewell|gold|llp|pvt|ltd/.test(x))score-=4;if(/[0-9@]/.test(x))score-=3;const letters=(s.match(/[A-Za-z]/g)||[]).length;score+=Math.min(5,letters/6);if(s.split(' ').length>=2)score+=2;return score;}
function pickPersonAndShop(lines){const candidates=lines.filter(goodOcrLine).map((s,i)=>({s,i,score:scoreNameLine(s)})).sort((a,b)=>b.score-a.score);const person=candidates.find(x=>x.score>=2.5)?.s||'';const shop=candidates.find(x=>x.s!==person&&x.score>=1.5)?.s||'';return {person,shop};}
function scannerCityState(){const city=$('sc'),state=$('ssc');if(!city||!state)return;state.value=cityState(city.value)||'';renderScannerCitySuggestions();}
function renderScannerCitySuggestions(){
 const city=$('sc'),box=$('scannerCitySuggestions');if(!city||!box)return;
 const matches=cityMatches(city.value);if(!matches.length){box.innerHTML='';box.style.display='none';return;}
 box.innerHTML=matches.map(c=>'<button type="button" class="city-option" data-city="'+esc(c)+'"><b>'+esc(c)+'</b><span>'+esc(CITY_STATE[c])+'</span></button>').join('');
 box.querySelectorAll('[data-city]').forEach(btn=>btn.addEventListener('click',()=>chooseScannerCity(btn.dataset.city)));
 box.style.display='block';
}

async function scanCard(){
 if(!scanFile)return;if(!window.Tesseract)return toast('Offline OCR is not bundled in this version. Use manual entry for the visiting card.');
 $('scanBtn').disabled=true;$('ocrStatus').textContent='Preparing image...';
 try{
  const processed=await preprocessCard(scanFile);$('ocrStatus').textContent='Scanning enhanced card...';
  const r=await Tesseract.recognize(processed,'eng',{logger:m=>{if(m.status==='recognizing text')$('ocrStatus').textContent='Scanning '+Math.round((m.progress||0)*100)+'%'}});
  const text=r?.data?.text||'';$('ocrText').value=text;const lines=text.split(/\n/).map(normalizeOcrLine).filter(Boolean);
  const phones=extractPhones(text);$('sm').value=phones[0]||'';$('sa').value=phones[1]||'';
  const city=extractCity(text);if(city){$('sc').value=city;$('ssc').value=CITY_STATE[city]||'';}
  const {person,shop}=pickPersonAndShop(lines);$('sn').value=person;$('snshop').value=shop;
  const email=extractEmail(text),used=new Set([person,shop,city,...phones].filter(Boolean).map(normalizeOcrLine));
  $('saddr').value=lines.filter(x=>!used.has(x)&&!/phone|mobile|email|www|director|manager|owner|proprietor/i.test(x)).slice(0,5).join(', ');
  const conf=Number(r?.data?.confidence||0);$('ocrStatus').textContent=(conf?('OCR complete • confidence '+Math.round(conf)+'%. '):'OCR complete. ')+'Review every field before saving.'+(email?' Email detected: '+email:'');
 }catch(e){console.error(e);$('ocrStatus').textContent='OCR failed. Try a clearer, well-lit photo with the whole card visible.'}finally{$('scanBtn').disabled=false;}
}
function clearScan(){scanFile=null;if($('cardFile'))$('cardFile').value='';['snshop','sn','sm','sa','sc','ssc','saddr','ocrText'].forEach(id=>{if($(id))$(id).value=''});if($('cardImg')){$('cardImg').style.display='none';$('cardImg').removeAttribute('src')}if($('scanBtn'))$('scanBtn').disabled=true;if($('ocrStatus'))$('ocrStatus').textContent='Choose a card photo to begin.';const b=$('scannerCitySuggestions');if(b){b.innerHTML='';b.style.display='none';}}
function saveScan(){const name=formatPersonName($('sn').value),mobile:$('sm').value.replace(/\D/g,'').slice(-10),city:$('sc').value.trim();if(!name||mobile.length!==10)return toast('Review Customer Name and 10-digit Mobile');db.customers.push({id:Date.now(),name,shop:formatJewelleryName($('snshop').value),contactPerson:'',mobile,alt:$('sa').value.replace(/\D/g,'').slice(-10),city,address:$('saddr').value.trim(),state:cityState(city)||$('ssc').value.trim(),exhibition:'',notes:'From visiting card scanner',dateAdded:new Date().toISOString().slice(0,10)});save();toast('Customer saved');clearScan();go('customers');}
function bytesToB64(bytes){let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function b64ToBytes(s){let bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function deriveBackupKey(pin,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function backup(){
 if(!securityEnabled())return showSecurityScreen('setup');
 const pin=prompt('Enter your PIN to create encrypted backup:');if(!pin)return;
 if(securityHash(pin)!==db.settings.security.pinHash)return toast('Wrong PIN');
 try{const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveBackupKey(pin,salt);const payload={app:'SHREE JI CONNECT',version:db.settings.version,exportedAt:new Date().toISOString(),data:db};const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(payload)));const out={format:'SJC_ENCRYPTED_BACKUP_V1',salt:bytesToB64(salt),iv:bytesToB64(iv),data:bytesToB64(new Uint8Array(cipher))};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));a.download='shree-ji-connect-encrypted-backup-'+new Date().toISOString().slice(0,10)+'.sjc.json';a.click();toast('Encrypted backup downloaded');}catch(e){console.error(e);toast('Backup failed')}
}
function backupPlain(){
 let payload={app:'SHREE JI CONNECT',version:db.settings.version,exportedAt:new Date().toISOString(),data:db};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='shree-ji-connect-plain-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Plain backup downloaded');
}
async function restoreFile(e){
 let f=e.target.files[0];if(!f)return;
 try{let p=JSON.parse(await f.text()),x;
   if(p.format==='SJC_ENCRYPTED_BACKUP_V1'){
     const pin=prompt('Enter backup PIN to decrypt:');if(!pin)return;
     const key=await deriveBackupKey(pin,b64ToBytes(p.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(p.iv)},key,b64ToBytes(p.data));const q=JSON.parse(new TextDecoder().decode(plain));x=q.data||q;
   }else{x=p.data||p;if(!confirm('This is a plain backup. Restore it?'))return}
   if(!x.customers||!x.orders)throw 1;if(!confirm('Restore this backup? Current local data will be replaced.'))return;
   db={...structuredClone(defaults),...x,settings:{...defaults.settings,...(x.settings||{}),security:{...defaults.settings.security,...(x.settings?.security||{})}},templates:x.templates||structuredClone(defaults.templates)};save();renderAll();toast('Data restored');startSecurityTimer();
 }catch(z){console.error(z);toast('Invalid backup or wrong PIN')}
}
